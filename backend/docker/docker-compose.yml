services:
  postgres:
    image: postgres:16-alpine
    container_name: pepnetcom-postgres
    environment:
      POSTGRES_USER: pepnetcom
      POSTGRES_PASSWORD: pepnetcom_secret
      POSTGRES_DB: pepnetcom
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pepnetcom -d pepnetcom"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: valkey/valkey:8-alpine
    container_name: pepnetcom-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
